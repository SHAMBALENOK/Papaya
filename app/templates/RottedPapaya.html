<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка сервера | Papaya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 60px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
        }

        .error-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4);
        }

        .error-icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }

        .error-code {
            font-size: 64px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-details {
            background: #f8f9fa;
            border-left: 4px solid #ff416c;
            padding: 15px;
            margin: 25px 0;
            text-align: left;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
            display: none;
        }

        .error-details.show {
            display: block;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .debug-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
            color: #555;
        }

        .debug-info h4 {
            margin-bottom: 10px;
            color: #333;
            font-size: 15px;
        }

        .debug-info p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .debug-info code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 600px) {
            .error-container {
                padding: 40px 20px;
            }

            .error-code {
                font-size: 52px;
            }

            .error-title {
                font-size: 24px;
            }
        }

        .animation {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon animation">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>

        <div class="error-code">500</div>
        <h1 class="error-title">Внутренняя ошибка сервера</h1>
        <p class="error-message">
            Что-то пошло не так на нашей стороне. Мы уже работаем над исправлением этой проблемы.
        </p>

        <div class="error-details" id="errorDetails">
            <!-- Детали ошибки будут вставлены сюда -->
        </div>

        <div class="btn-container">
            <a href="/" class="btn">
                На главную
            </a>
        </div>

        <div class="debug-info" id="debugInfo" style="display: none;">
            <h4>Информация для отладки:</h4>
            <p><strong>Время ошибки:</strong> <span id="errorTime"></span></p>
            <p><strong>URL:</strong> <code id="errorUrl"></code></p>
            <p><strong>Тип ошибки:</strong> <code id="errorType"></code></p>
        </div>
    </div>

    <script>
        // Получение параметров из URL
        const urlParams = new URLSearchParams(window.location.search);
        const errorType = urlParams.get('type') || 'unknown';
        const errorMessage = urlParams.get('message') || 'Неизвестная ошибка сервера';
        const errorDetails = urlParams.get('details');
        const debug = urlParams.get('debug') === 'true';

        // Отображение деталей ошибки
        if (errorDetails) {
            document.getElementById('errorDetails').textContent = decodeURIComponent(errorDetails);
            document.getElementById('errorDetails').classList.add('show');
        }

        // Отображение отладочной информации
        if (debug) {
            document.getElementById('debugInfo').style.display = 'block';
            document.getElementById('errorTime').textContent = new Date().toISOString();
            document.getElementById('errorUrl').textContent = window.location.href;
            document.getElementById('errorType').textContent = errorType;
        }
    </script>
</body>
</html>
