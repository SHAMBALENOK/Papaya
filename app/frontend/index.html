<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papaya — олимпиады для школьников</title>
    <meta name="description" content="Papaya — всероссийские и региональные олимпиады для школьников в одном месте.">

    <!--
      Шрифтовая пара: Inter (основной гротеск) + Public Sans (резерв).
      Geist добавлен в стек на случай локальной установки.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!--
      Tailwind CSS (Play CDN): zero-build, SPA без сборщика.
      Кастомная палитра и токены ниже.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    /* ======================================================================
       ДИЗАЙН-ТОКЕНЫ — строгий просторный минимализм (dashboard)

       БАЗОВАЯ ПАЛИТРА (чёрно-белая, максимальная читаемость):
         paper      #FFFFFF  поверхности (карточки, сайдбар, модалки)
         cream      #FFFFFC  фон холста
         ink        #1A1A1A  основной текст (≈17.4:1 на белом)
         ink.deep   #000000  hover ключевых действий
         ink.soft   #6B6B6B  вторичный текст (5.4:1 — WCAG AA)
         ink.faint  #9C9C9C  плейсхолдеры / подписи полей
         mist       #F5F5F5  подложки полей и вкладок
         mist.deep  #ECECEC  hover подложек

       ДОПОЛНИТЕЛЬНАЯ ПАЛИТРА (по ТЗ):
         sage       #CBE896  успех
         sand       #C6BFA9  нейтральные бейджи / вторичные кнопки
         ember      #FF7F11  акцент (логотип, FAB, аватары, маркер)
         crimson    #FF1B1C  ошибки / опасные действия

       КОНТРАСТ на акцентах: текст всегда ink (#1A1A1A):
         sage 14.2:1 · sand 9.5:1 · ember 6.9:1 · crimson 4.5:1 (AA).
         Белый текст на ember/crimson не используется.

       ОТСТУПЫ («воздух» — единственный разделитель, border: none):
         Базовый шаг — 4px (шкала Tailwind).
         Сайдбар 240px, контент px-6…px-12 / py-12…py-16.
         Секции — вертикальные разрывы py-14…py-20.
         Гриды каталога — gap-8; списки-строки — space-y-6.
         Карточки — p-8…p-12. Заголовок→контент mt-6…mt-8.

       ТЕНИ (soft elevation вместо рамок), три уровня:
         elev-1 — покой (карточки, сайдбар);
         elev-2 — hover / интерактив;
         elev-3 — модалки, тосты, FAB.
         Alpha 0.04–0.14 от #1A1A1A — нейтральные тени.

       ГЕОМЕТРИЯ:
         Поверхности — 0px (rounded-none);
         интерактив (кнопки, поля, бейджи) — 4px максимум.

       ТИПОГРАФИКА:
         Заголовки — Inter 700–900, tracking-tight, leading 1.05–1.15;
         тело — 16–18px, leading-relaxed / 1.8 для длинных текстов;
         надзаголовки (.eyebrow) — 12px uppercase, tracking 0.18em.
       ====================================================================== */
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    paper: '#FFFFFF',
                    cream: '#FFFFFC',
                    ink: {
                        DEFAULT: '#1A1A1A',
                        deep: '#000000',
                        soft: '#6B6B6B',
                        faint: '#9C9C9C',
                    },
                    mist: {
                        DEFAULT: '#F5F5F5',
                        deep: '#ECECEC',
                    },
                    sage:    '#CBE896',
                    sand:    '#C6BFA9',
                    ember:   '#FF7F11',
                    crimson: '#FF1B1C',
                },
                fontFamily: {
                    sans: ['Inter', 'Public Sans', 'Geist', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
                },
                borderRadius: {
                    none: '0px',
                    DEFAULT: '4px',
                    sm: '4px',
                    md: '4px',
                    lg: '4px',
                    xl: '4px',
                    full: '9999px',
                },
                boxShadow: {
                    'elev-1': '0 1px 2px rgba(26,26,26,0.04), 0 4px 12px rgba(26,26,26,0.05)',
                    'elev-2': '0 2px 4px rgba(26,26,26,0.05), 0 8px 24px rgba(26,26,26,0.09)',
                    'elev-3': '0 4px 8px rgba(26,26,26,0.06), 0 16px 48px rgba(26,26,26,0.14)',
                },
                maxWidth: { content: '72rem', narrow: '44rem' },
                spacing: { sidebar: '15rem' },
            },
        },
    };
    </script>

    <link rel="stylesheet" href="/frontend/css/style.css?v=2.0.0">
</head>
<body class="bg-cream text-ink font-sans antialiased min-h-screen">

    <!-- Доступность: переход к контенту с клавиатуры -->
    <a href="#page"
       class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[70] focus:bg-ink focus:text-white focus:px-5 focus:py-3 focus:rounded focus:text-sm focus:font-semibold">
        Перейти к содержимому
    </a>

    <!-- Затемнение мобильного drawer. Разделение с контентом — только тень/оверлей, без рамок. -->
    <div id="sidebar-backdrop" class="hidden fixed inset-0 z-40 bg-ink/40 md:hidden" hidden></div>

    <!--
      Сайдбар дашборда: белая поверхность, elev-1 вместо границы.
      Desktop — фиксированная колонка 240px; mobile — выезжающая панель.
    -->
    <aside id="sidebar"
           class="fixed inset-y-0 left-0 z-50 w-sidebar bg-white shadow-elev-1 flex-col"
           aria-label="Навигация дашборда">
        <div class="h-20 px-6 flex items-center justify-between shrink-0">
            <a href="#/welcome" class="text-2xl font-extrabold tracking-tight text-ink rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-ink/60">
                Papaya<span class="text-ember" aria-hidden="true">.</span>
            </a>
            <button type="button" id="sidebar-close" aria-label="Закрыть меню"
                    class="md:hidden w-10 h-10 rounded bg-mist text-ink-soft hover:text-ink hover:bg-mist-deep flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-ink/60">
                &times;
            </button>
        </div>
        <nav id="nav" aria-label="Основная навигация"
             class="flex-1 px-4 py-6 flex flex-col gap-1 overflow-y-auto"></nav>
        <div id="sidebar-user" class="px-4 py-6"></div>
    </aside>

    <div id="app-frame" class="min-h-screen transition-[padding] duration-200">
        <!-- Мобильная шапка: видна только на узких экранах, когда chrome включён -->
        <header id="header" class="hidden sticky top-0 z-30 bg-white/95 backdrop-blur shadow-elev-1 md:hidden">
            <div class="h-16 px-4 flex items-center justify-between gap-4">
                <button type="button" id="sidebar-open" aria-label="Открыть меню" aria-controls="sidebar" aria-expanded="false"
                        class="w-10 h-10 rounded bg-mist text-ink hover:bg-mist-deep flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-ink/60">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                    </svg>
                </button>
                <a href="#/welcome" class="text-xl font-extrabold tracking-tight">
                    Papaya<span class="text-ember" aria-hidden="true">.</span>
                </a>
                <span class="w-10" aria-hidden="true"></span>
            </div>
        </header>

        <main id="page" class="mx-auto max-w-content px-6 md:px-10 lg:px-12 py-12 md:py-16"></main>
    </div>

    <div id="toast-container" aria-live="polite"
         class="fixed top-6 right-6 z-[60] flex flex-col gap-3 pointer-events-none"></div>

    <script src="/frontend/js/store.js?v=2.0.0"></script>
    <script src="/frontend/js/api.js?v=2.0.0"></script>
    <script src="/frontend/js/pages/auth.js?v=2.0.0"></script>
    <script src="/frontend/js/pages/welcome.js?v=2.0.0"></script>
    <script src="/frontend/js/pages/dashboard.js?v=2.0.0"></script>
    <script src="/frontend/js/pages/event.js?v=2.0.0"></script>
    <script src="/frontend/js/pages/profile.js?v=2.0.0"></script>
    <script src="/frontend/js/pages/users.js?v=2.0.0"></script>
    <script src="/frontend/js/pages/myevents.js?v=2.0.0"></script>
    <script src="/frontend/js/pages/admin.js?v=2.0.0"></script>
    <script src="/frontend/js/router.js?v=2.0.0"></script>
    <script src="/frontend/js/app.js?v=2.0.0"></script>
</body>
</html>
