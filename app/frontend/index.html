<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papaya — олимпиады для школьников</title>
    <meta name="description" content="Papaya — всероссийские и региональные олимпиады для школьников в одном месте.">

    <!-- Inter — современный гротеск интерфейса -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
      Tailwind CSS (Play CDN): zero-build решение, сохраняющее SPA-архитектуру
      проекта. Кастомная палитра и токены ниже. Для продакшена рекомендуется
      перейти на сборку Tailwind CLI — конфиг переносится без изменений.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    /* ======================================================================
       ДИЗАЙН-ТОКЕНЫ
       Палитра (по ТЗ):
         ink     #1A1A1A  основной текст (17.4:1 на белом)
         paper   #FFFFFF  фон
         primary #064789  ключевые действия (9.25:1)
         navy    #427AA1  навигация (4.64:1 — AA)
         tint    #EBF2FA  светлые подложки (формы, вкладки)
         moss    #679436  успех — точки, акценты, hover (не для мелкого текста)
         lime    #A5BE00  декоративный позитивный акцент (только графика)
       Производные тона введены исключительно ради контраста WCAG AA:
         moss-deep  #43611F  доступный зелёный текст (7.07:1)
         moss-light #EFF4E4  фон зелёных бейджей
         moss-btn   #4C6C24  зелёные кнопки, белый текст (6.04:1)
         lime-light #F6F9DC  фон лаймовых бейджей
         lime-btn   #33608F  вторичные синие кнопки (6.54:1)
         danger     #B42318  ошибки (6.57:1) — единственное исключение палитры
       ЛОГИКА ОТСТУПОВ: базовый шаг 4px; секции разделяются вертикальными
         разрывами py-16…py-24, гриды — gap-8, контент карточек — p-8…p-12.
         «Воздух» — единственное средство разделения блоков.
       ЛОГИКА ТЕНЕЙ (soft elevation): border: none по всему проекту; глубина
         строится многослойными мягкими тенями в три уровня:
         elev-1 — покой (карточки, шапка), elev-2 — hover/фокус,
         elev-3 — модалки и оверлеи.
       ====================================================================== */
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    ink:        '#1A1A1A',
                    paper:      '#FFFFFF',
                    primary:    { DEFAULT: '#064789', deep: '#05396E' },
                    navy:       '#427AA1',
                    tint:       { DEFAULT: '#EBF2FA', deep: '#DBE9F9' },
                    moss:       { DEFAULT: '#679436', deep: '#43611F', light: '#EFF4E4', btn: '#4C6C24' },
                    lime:       { DEFAULT: '#A5BE00', light: '#F6F9DC', btn: '#33608F' },
                    danger:     { DEFAULT: '#B42318', light: '#FBEAE8' },
                },
                fontFamily: {
                    sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
                },
                /* Строгая геометрия: поверхности 0px, интерактивные элементы до 4px */
                borderRadius: { none: '0px', sm: '2px', DEFAULT: '4px', md: '4px', lg: '4px', xl: '4px' },
                boxShadow: {
                    /* Многослойные мягкие тени вместо границ блоков */
                    'elev-1': '0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05)',
                    'elev-2': '0 2px 6px rgba(15,23,42,0.06), 0 12px 28px rgba(15,23,42,0.10)',
                    'elev-3': '0 4px 10px rgba(15,23,42,0.06), 0 24px 56px rgba(15,23,42,0.14)',
                },
                maxWidth: { content: '72rem', narrow: '48rem' },
            },
        },
    };
    </script>

    <link rel="stylesheet" href="/frontend/css/style.css?v=0.5.2">
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen">

    <!-- Доступность: быстрый переход к контенту с клавиатуры -->
    <a href="#page"
       class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[60] focus:bg-primary focus:text-white focus:px-5 focus:py-3 focus:rounded focus:text-sm focus:font-semibold">
        Перейти к содержимому
    </a>

    <!-- Шапка: белый фон + тень elev-1 вместо нижней границы -->
    <header id="header" class="hidden sticky top-0 z-40 bg-white/95 backdrop-blur shadow-elev-1">
        <div class="mx-auto max-w-content px-6 md:px-10 h-20 flex items-center justify-between gap-6">
            <a href="#/" class="text-2xl font-extrabold tracking-tight text-ink rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                Papaya<span class="text-lime" aria-hidden="true">.</span>
            </a>
            <nav id="nav" aria-label="Основная навигация"
                 class="flex items-center gap-1 md:gap-2 flex-wrap justify-end"></nav>
        </div>
    </header>

    <main id="page" class="mx-auto max-w-content px-6 md:px-10 py-12 md:py-16"></main>

    <!-- Тосты: aria-live для озвучивания скринридерами -->
    <div id="toast-container" aria-live="polite"
         class="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script src="/frontend/js/store.js?v=0.5.2"></script>
    <script src="/frontend/js/api.js?v=0.5.2"></script>
    <script src="/frontend/js/pages/auth.js?v=0.5.2"></script>
    <script src="/frontend/js/pages/dashboard.js?v=0.5.2"></script>
    <script src="/frontend/js/pages/event.js?v=0.5.2"></script>
    <script src="/frontend/js/pages/profile.js?v=0.5.2"></script>
    <script src="/frontend/js/pages/myevents.js?v=0.5.2"></script>
    <script src="/frontend/js/pages/admin.js?v=0.5.2"></script>
    <script src="/frontend/js/router.js?v=0.5.2"></script>
    <script src="/frontend/js/app.js?v=0.5.2"></script>
</body>
</html>
