<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация | Papaya</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form" id="login-form">
            <h2>Вход</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            <p class="auth-switch">
                Нет аккаунта? <a href="#" onclick="toggleAuthMode(); return false;">Зарегистрироваться</a>
            </p>
            <div id="login-error" class="error-message"></div>
        </div>

        <div class="auth-form" id="register-form" style="display: none;">
            <h2>Регистрация</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-name">Имя</label>
                    <input type="text" id="reg-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="reg-surname">Фамилия</label>
                    <input type="text" id="reg-surname" name="surname" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Пароль</label>
                    <input type="password" id="reg-password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </form>
            <p class="auth-switch">
                Уже есть аккаунт? <a href="#" onclick="toggleAuthMode(); return false;">Войти</a>
            </p>
            <div id="register-error" class="error-message"></div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
