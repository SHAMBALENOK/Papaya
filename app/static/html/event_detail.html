<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Событие - Papaya</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/static/html/main.html" class="logo">← Вернуться к списку</a>
    </nav>

    <main class="container">
        <div id="event-loading" class="loading">Загрузка...</div>

        <div id="event-view" style="display: none;">
            <div class="event-header">
                <img id="event-image" src="" alt="Event preview">
                <h1 id="event-name"></h1>
            </div>

            <section class="event-section">
                <h2>Параметры участия</h2>
                <div id="event-params" class="event-params">
                    <!-- Filled by JS -->
                </div>
            </section>

            <section class="event-section" id="event-details-section" style="display: none;">
                <h2>Детали мероприятия</h2>
                <div id="event-details" class="event-details">
                    <!-- Filled by JS -->
                </div>
            </section>

            <section class="event-section">
                <h2>Информация</h2>
                <div class="event-info">
                    <div class="status-badge" id="event-status">
                        <span class="status-dot"></span>
                        <span class="status-text"></span>
                    </div>
                </div>
            </section>

            <div class="event-meta">
                <p>ID События: <span id="event-id"></span></p>
                <p>Обновлено: <span id="event-updated"></span></p>
            </div>
        </div>
    </main>

    <script src="/static/js/event.js"></script>
</body>
</html>
