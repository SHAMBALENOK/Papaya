[pytest]
asyncio_mode = auto
# Функциональный scope важен: фикстура client поднимает и опускает lifespan
# приложения (пулы Redis/БД) в том же event loop, в котором работает сам тест.
# Session-scope приводит к рассинхрону loop'ов и ошибкам teardown.
asyncio_default_fixture_loop_scope = function
testpaths = tests