name: papaya

# Запуск: docker compose up -d --build
# Приложение: http://localhost:5000
# pgAdmin:    http://localhost:5050

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - project

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:7.2
    environment:
      PGADMIN_DEFAULT_EMAIL: "postgres@postgres.com"
      PGADMIN_DEFAULT_PASSWORD: "postgres"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
    networks:
      - project

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project

  web:
    build: .
    container_name: web
    environment:
      JWT_KEY: "change_this_secret_key"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/postgres"
      HF_TOKEN: "${HF_TOKEN:-your_secret_token}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      TABLES_DIR: "/app/app/tables"
    # Google Translate из Docker часто ломается из-за IPv6 (httpx -> ConnectTimeout)
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - "5000:5000"
    volumes:
      - ./app/tables:/app/app/tables
      - ml-models-cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - project
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
          ignore:
            - __pycache__
            - "*.pyc"
        - action: rebuild
          path: requirements.txt

  celery:
    build: .
    container_name: celery
    command: ["celery", "-A", "app.middlewares.task_queue.task_queue", "worker", "-Q", "heavy,medium", "-l", "info", "-c", "4"]
    environment:
      JWT_KEY: "change_this_secret_key"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/postgres"
      HF_TOKEN: "${HF_TOKEN:-your_secret_token}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      TABLES_DIR: "/app/app/tables"
    # Google Translate из Docker часто ломается из-за IPv6 (httpx -> ConnectTimeout)
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ./app/tables:/app/app/tables
      - ml-models-cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - project

volumes:
  postgres-data:
  pgadmin-data:
  ml-models-cache:
  redis-data:

networks:
  project: