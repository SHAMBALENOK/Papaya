name: papaya

# Запуск: docker compose up -d --build
# Приложение: http://localhost:5000
# pgAdmin:    http://localhost:5050

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - project

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:7.2
    environment:
      PGADMIN_DEFAULT_EMAIL: "postgres@postgres.com"
      PGADMIN_DEFAULT_PASSWORD: "postgres"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
    networks:
      - project

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project

  # Одноразовая подготовка каталогов данных.
  #
  # На Windows и macOS bind-монтированное рабочее дерево приходит в контейнер
  # как root:root, а приложение работает от appuser (uid 1000, см. Dockerfile):
  # загрузка документов и импорт падали с Permission denied. Сервис выравнивает
  # владельца каталогов данных до старта web/celery. Меняются только метаданные,
  # содержимое не трогается; на Linux-хосте с uid 1000 операция безвредна.
  app-data-init:
    build: .
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /app/app/tables/docs &&
        chown -R appuser:appuser /app/app/tables /app/.cache
    volumes:
      - ./app:/app/app
      - ml-models-cache:/app/.cache
    restart: "no"
    networks:
      - project

  web:
    build: .
    container_name: web
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      JWT_KEY: "${JWT_KEY:-change_this_secret_key}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/postgres}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      CACHE_TTL: "${CACHE_TTL:-600}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-30}"
      TABLES_DIR: "/app/app/tables"
      DOCS_DIR: "/app/app/tables/docs"
      # Стратегия запуска импорта РСОШ: celery (в фоне) либо inline (в процессе
      # API). auto — celery, если брокер доступен, иначе inline.
      RSOSH_EXECUTION: "${RSOSH_EXECUTION:-auto}"
      RSOSH_PDF_DPI: "${RSOSH_PDF_DPI:-300}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    ports:
      - "5000:5000"
    volumes:
      # Рабочее дерево вместо кода, запечённого в образ: правки в app/
      # подхватываются без пересборки. requirements.txt при изменении требует
      # `docker compose build web` (смотрите README).
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ml-models-cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - project

  celery:
    build: .
    container_name: celery
    command: ["celery", "-A", "app.middlewares.task_queue.task_queue", "worker", "-Q", "heavy", "-l", "info", "-c", "1"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      JWT_KEY: "${JWT_KEY:-change_this_secret_key}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/postgres}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      CACHE_TTL: "${CACHE_TTL:-600}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-30}"
      TABLES_DIR: "/app/app/tables"
      DOCS_DIR: "/app/app/tables/docs"
      RSOSH_EXECUTION: "${RSOSH_EXECUTION:-auto}"
      RSOSH_PDF_DPI: "${RSOSH_PDF_DPI:-300}"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ml-models-cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Воркер считается живым, если отвечает на ping Celery.
      test: ["CMD-SHELL", "celery -A app.middlewares.task_queue.task_queue inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - project

  test:
    image: papaya-web:latest
    profiles: ["testing"]
    container_name: papaya-test
    # Тестовый профиль ставит dev-зависимости в системный Python, поэтому
    # запускается от root. Сам образ приложения — непривилегированный (USER
    # appuser в Dockerfile); здесь это осознанное исключение только для тестов.
    user: root
    command: >
      sh -c "pip install --no-cache-dir -q -r /app/requirements-dev.txt &&
             pytest -q"
    environment:
      ENVIRONMENT: "testing"
      JWT_KEY: "pytest_secret_key_for_local_tests_only"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/papaya_test"
      DATABASE_URL_TEST: "postgresql+asyncpg://postgres:postgres@postgres:5432/papaya_test"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379/0"
      CACHE_TTL: "60"
      MAX_UPLOAD_MB: "1"
      TABLES_DIR: "/tmp/papaya-tables-test"
      DOCS_DIR: "/tmp/papaya-docs-test"
      # В тестовом окружении нет celery-воркера: импорт выполняется в процессе API.
      RSOSH_EXECUTION: "inline"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Тесты запускаются против рабочего дерева, а не против кода,
      # запечённого в образ: правки в app/ и tests/ подхватываются без rebuild.
      # scripts/ тоже монтируется: entrypoint через ensure_db_schema.py
      # накатывает миграции, и он должен быть из рабочего дерева.
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./alembic.ini:/app/alembic.ini
      - ./requirements-dev.txt:/app/requirements-dev.txt
    networks:
      - project

volumes:
  postgres-data:
  pgadmin-data:
  ml-models-cache:
  redis-data:

networks:
  project:
