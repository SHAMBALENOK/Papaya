version: "3.9"
services:
  postgres:
    image: postgres:14.8-alpine3.18
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ../2. Init Database:/docker-entrypoint-initdb.d
      - habrdb-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U habrpguser -d habrdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    networks:
      - project

  web:
    build: .
    container_name: papaya_web
    environment:
      - FLASK_SECRET_KEY=change_this_super_secret_key_12345
      - SITE_NAME=localhost
      # Формируем DATABASE_URL напрямую
      - DATABASE_URL=postgresql://papaya_admin:strong_password_here@db:5432/papaya_events
    ports:
      - "5000:5000"
    volumes:
      - ./tables:/app/tables
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - project

volumes:
  habrdb-data:
  pgadmin-data:

networks:
  project: