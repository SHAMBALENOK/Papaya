version: "3.9"

name: papaya

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ../2. Init Database:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    networks:
      - project

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:7.2
    environment:
      PGADMIN_DEFAULT_EMAIL: "postgres@postgres.com"
      PGADMIN_DEFAULT_PASSWORD: "postgres"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - project

  web:
    build: .
    container_name: web
    environment:
      FLASK_SECRET_KEY: 'change_key'
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/postgres'
      HF_TOKEN: 'your_token'
    ports:
      - "5000:5000"
    volumes:
      - ./tables:/app/tables
      - ml-models-cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - project
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
        - action: rebuild
          path: requirements.txt
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 12G

volumes:
  postgres-data:
  pgadmin-data:
  ml-models-cache:

networks:
  project: