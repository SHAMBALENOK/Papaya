version: "3.9"
name: papaya-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "test_db"
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_pass"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  web-test:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
    environment:
      JWT_KEY: 'test_secret_key_for_testing'
      DATABASE_URL: 'postgresql+asyncpg://test_user:test_pass@postgres-test:5432/test_db'
      TEST_MODE: 'true'
    ports:
      - "5001:5000"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - test-network

  pytest-runner:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.test
    environment:
      TEST_BASE_URL: "http://web-test:5000"
      TEST_DATABASE_URL: "postgresql://test_user:test_pass@postgres-test:5432/test_db"
    depends_on:
      - web-test
    command: pytest -v tests/
    networks:
      - test-network

networks:
  test-network:
    driver: bridge