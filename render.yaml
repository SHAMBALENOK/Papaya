services:
  - type: web
    name: papaya
    runtime: docker
    repo: https://github.com/SHAMBALENOK/Papaya
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      /bin/sh -c 'exec gunicorn --bind 0.0.0.0:10000 --timeout 300 --graceful-timeout 120 --workers 1 --worker-class uvicorn.workers.UvicornWorker --preload app.main:app'
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: JWT_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: papaya-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: papaya-redis
          property: connectionString
      - key: MAX_UPLOAD_MB
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: RSOSH_EXECUTION
        value: "inline"
      - key: RSOSH_PDF_DPI
        value: "200"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"

  # Redis (Key Value): сессии обновления, кэш ролей и счётчики ограничения
  # частоты запросов живут здесь. Без него приложение не работает: без Redis
  # не создаётся сессия, а вход/регистрация лишаются лимитов.
  - type: redis
    name: papaya-redis
    region: frankfurt
    plan: free
    ipAllowList: []

databases:
  - name: papaya-db
    region: frankfurt
    databaseName: papaya
    user: papaya
    postgresMajorVersion: "16"
    plan: free
