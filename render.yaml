services:
  - type: web
    name: papaya
    runtime: docker
    repo: https://github.com/SHAMBALENOK/Papaya
    branch: patch-0.8
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      /bin/sh -c 'exec gunicorn --bind 0.0.0.0:10000 --timeout 300 --graceful-timeout 120 --workers 1 --worker-class uvicorn.workers.UvicornWorker --preload app.main:app'
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: JWT_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: papaya-db
          property: connectionString
      - key: MAX_UPLOAD_MB
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: RSOSH_EXECUTION
        value: "inline"
      - key: RSOSH_PDF_DPI
        value: "200"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"

databases:
  - name: papaya-db
    region: frankfurt
    databaseName: papaya
    user: papaya
    postgresMajorVersion: "16"
    plan: free