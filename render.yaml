services:
  - type: web
    name: papaya
    env: docker
    region: frankfurt
    plan: free
    repo: https://github.com/SHAMBALENOK/Papaya
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: papaya-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INIT_EVENT_ID
        value: "111"
      - key: INIT_EVENT_NAME
        value: "Мероприятие от Papaya"
      - key: INIT_EVENT_PLACE
        value: "Онлайн"
      - key: INIT_EVENT_MIN_GRADE
        value: "1"
      - key: INIT_EVENT_MAX_GRADE
        value: "11"
      - key: INIT_EVENT_MIN_AGE
        value: "6"
      - key: INIT_EVENT_MAX_AGE
        value: "17"
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: EASYOCR_MODULE_PATH
        value: /app/.cache/easyocr
      - key: HF_TOKEN
        sync: false

databases:
  - name: papaya-db
    databaseName: papaya
    user: papaya
    plan: free