services:
  - type: web
    name: papaya
    env: docker
    region: frankfurt
    plan: free
    repo: https://github.com/SHAMBALENOK/Papaya
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    # Оптимизация для 512MB RAM: 1 воркер, увеличенный таймаут для RSOSH-импорта
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 --graceful-timeout 120 --workers 1 --preload app.main:app
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: JWT_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: papaya-db
          property: connectionString
      - key: MAX_UPLOAD_MB
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      # Ограничение потоков для экономии памяти на CPU
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"

databases:
  - name: papaya-db
    databaseName: papaya
    user: papaya
    plan: free